name: Deploy to GitHub Pages

# The content comes from afias studio (CONTENT_URL below), on every trigger: a push only
# changes code, the studio holds the copy. Publishing in the studio sends the
# repository_dispatch "afias-publish"; those runs report building → ready/failed back.
#
# Repo settings: variables STUDIO_URL and SITE_SLUG, secret AFIAS_DEPLOY_TOKEN
# (and the two font secrets below). If the studio can't be reached, the build fails
# and the live site stays as it was.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [afias-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  STUDIO_URL: ${{ vars.STUDIO_URL }}
  SITE_SLUG: ${{ vars.SITE_SLUG }}
  CONTENT_SOURCE: http
  CONTENT_URL: ${{ vars.STUDIO_URL }}/api/v1/sites/${{ vars.SITE_SLUG }}
  DEPLOYMENT_ID: ${{ github.event.client_payload.deployment }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tell the studio we're building
        if: github.event_name == 'repository_dispatch'
        env:
          AFIAS_DEPLOY_TOKEN: ${{ secrets.AFIAS_DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST "$STUDIO_URL/api/v1/sites/$SITE_SLUG/deployments" \
            -H "authorization: Bearer $AFIAS_DEPLOY_TOKEN" -H "content-type: application/json" \
            -d "{\"status\":\"building\",\"deployment\":\"$DEPLOYMENT_ID\"}" || true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Sigalit's free license allows embedding the font in the site but not
      # redistributing the files, so they live in repository secrets, not in git.
      - name: Add licensed font files
        env:
          SIGALIT_WOFF2_B64: ${{ secrets.SIGALIT_WOFF2_B64 }}
          SIGALIT_WOFF_B64: ${{ secrets.SIGALIT_WOFF_B64 }}
        run: |
          mkdir -p public/assets/fonts
          printf '%s' "$SIGALIT_WOFF2_B64" | base64 -d > public/assets/fonts/sigalit-regular-fm.woff2
          printf '%s' "$SIGALIT_WOFF_B64" | base64 -d > public/assets/fonts/sigalit-regular-fm.woff
          test -s public/assets/fonts/sigalit-regular-fm.woff2 || { echo "Missing SIGALIT_WOFF2_B64 secret"; exit 1; }

      - id: pages
        uses: actions/configure-pages@v6

      # Studio content → .render/ (build.mjs, plus the editor's _afias/preview.html), then
      # minified, font-self-hosted dist/ with absolute OG/canonical URLs (.github/scripts/optimize.mjs).
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Tell the studio it's live
        if: success() && github.event_name == 'repository_dispatch'
        env:
          AFIAS_DEPLOY_TOKEN: ${{ secrets.AFIAS_DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST "$STUDIO_URL/api/v1/sites/$SITE_SLUG/deployments" \
            -H "authorization: Bearer $AFIAS_DEPLOY_TOKEN" -H "content-type: application/json" \
            -d "{\"status\":\"ready\",\"deployment\":\"$DEPLOYMENT_ID\"}" || true

  report-failure:
    needs: [build, deploy]
    if: failure() && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - env:
          AFIAS_DEPLOY_TOKEN: ${{ secrets.AFIAS_DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST "$STUDIO_URL/api/v1/sites/$SITE_SLUG/deployments" \
            -H "authorization: Bearer $AFIAS_DEPLOY_TOKEN" -H "content-type: application/json" \
            -d "{\"status\":\"failed\",\"deployment\":\"$DEPLOYMENT_ID\",\"message\":\"הבנייה נכשלה ב-GitHub Actions. האתר החי לא השתנה.\"}" || true

  # Scores the live page after every deploy (mobile + desktop). Informational:
  # it lists every audit below 100 in the log and never blocks the deploy.
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Wait for Pages to serve the new build
        run: for i in $(seq 1 12); do curl -sf -o /dev/null "$URL" && break; sleep 10; done
        env:
          URL: ${{ needs.deploy.outputs.page_url }}

      - run: node .github/scripts/lighthouse.mjs "${{ needs.deploy.outputs.page_url }}"
