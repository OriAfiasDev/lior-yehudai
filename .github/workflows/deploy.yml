name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Sigalit's free license allows embedding the font in the site but not
      # redistributing the files, so they live in repository secrets, not in git.
      - name: Add licensed font files
        env:
          SIGALIT_WOFF2_B64: ${{ secrets.SIGALIT_WOFF2_B64 }}
          SIGALIT_WOFF_B64: ${{ secrets.SIGALIT_WOFF_B64 }}
        run: |
          mkdir -p public/assets/fonts
          printf '%s' "$SIGALIT_WOFF2_B64" | base64 -d > public/assets/fonts/sigalit-regular-fm.woff2
          printf '%s' "$SIGALIT_WOFF_B64" | base64 -d > public/assets/fonts/sigalit-regular-fm.woff
          test -s public/assets/fonts/sigalit-regular-fm.woff2 || { echo "Missing SIGALIT_WOFF2_B64 secret"; exit 1; }

      - id: pages
        uses: actions/configure-pages@v6

      # Content → .render/ (build.mjs), then minified, font-self-hosted dist/ with
      # absolute OG/canonical URLs (.github/scripts/optimize.mjs).
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Scores the live page after every deploy (mobile + desktop). Informational:
  # it lists every audit below 100 in the log and never blocks the deploy.
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Wait for Pages to serve the new build
        run: for i in $(seq 1 12); do curl -sf -o /dev/null "$URL" && break; sleep 10; done
        env:
          URL: ${{ needs.deploy.outputs.page_url }}

      - run: node .github/scripts/lighthouse.mjs "${{ needs.deploy.outputs.page_url }}"
